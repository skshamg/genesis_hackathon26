[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sybil-shield"
version = "0.1.0"
description = "Synthetic-to-real Sybil detection toolkit"
requires-python = ">=3.10"
dependencies = ["numpy", "networkx", "scipy", "scikit-learn", "matplotlib", "fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]
